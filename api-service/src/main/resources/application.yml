spring:
  application:
    name: api-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scraperdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    # Switch to the Cloud SQL JDBC Socket Factory as the driver when deploying on GCP given its security benefits.
    # The password entry is removed as the Socket Factory handles authentication; securely connects to the database using IAM/Service Account credentials.
    # driver-class-name: com.google.cloud.sql.postgres.SocketFactory
    # url: jdbc:postgresql:///${DATABASE_NAME}?cloudSqlInstance=${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE_NAME}
    # username: ${SPRING_DATASOURCE_USERNAME}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

# --- Environment Variables to Set for Production ---
# GCP_PROJECT_ID=gcp-project
# GCP_REGION=instance-region
# CLOUD_SQL_INSTANCE_NAME=instance-name
# DATABASE_NAME=scraperdb
# SPRING_DATASOURCE_USERNAME=db-user