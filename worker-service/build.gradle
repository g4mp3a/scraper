dependencies {
	
	def ext = rootProject.ext

    // --- CORE SPRING BOOT ---
    implementation "${ext.springBootWeb}"
    implementation "${ext.springBootValidation}"
    implementation "${ext.springBootSecurity}"
    implementation "${ext.springBootDataJpa}"
    implementation "${ext.springBootRetry}"


    // --- HTTP CLIENT AND SCRAPING ---
    implementation "org.jsoup:jsoup:1.17.2"
    implementation "io.ktor:ktor-client-core:${ext.ktorVersion}"
    implementation "io.ktor:ktor-client-cio:${ext.ktorVersion}"
    implementation "com.google.code.gson:gson:2.10.1"
}

springBoot {
    mainClass = 'com.scraper.worker.WorkerApplicationKt'
}